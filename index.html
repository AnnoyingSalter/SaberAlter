<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuna | Salter Yukata Portfolio</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-fallback: #120b24;
            --glass-bg: rgba(20, 14, 38, 0.62);
            --glass-border: rgba(216, 180, 226, 0.22);
            --accent-purple: #9d65c9;
            --accent-crimson: #d63858;
            --accent-pink: #f4a9c8;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-fallback);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -3;
            filter: brightness(0.75);
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(18, 11, 36, 0.22), rgba(10, 6, 22, 0.68));
            z-index: -2;
            pointer-events: none;
        }

        #sakura-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(8, 4, 20, 0.5);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            flex-wrap: wrap;
            gap: 14px;
        }

        .profile-mini {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-crimson));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            border: 2px solid var(--accent-pink);
            overflow: hidden;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-role {
            background: rgba(214, 56, 88, 0.25);
            border: 1px solid rgba(214, 56, 88, 0.5);
            color: var(--accent-pink);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .nav-tabs {
            display: flex;
            align-items: center;
            background: rgba(14, 9, 28, 0.72);
            padding: 5px;
            border-radius: 999px;
            border: 1px solid rgba(244, 169, 200, 0.25);
            gap: 4px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            background: rgba(244, 169, 200, 0.16);
            border-color: rgba(244, 169, 200, 0.45);
            color: var(--accent-pink);
            box-shadow: 0 2px 12px rgba(214, 56, 88, 0.2);
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .music-player {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(14, 9, 28, 0.7);
            border: 1px solid var(--glass-border);
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-pink);
            transition: 0.2s;
        }

        .music-player:hover {
            border-color: var(--accent-crimson);
            color: #fff;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 22px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr; }
        }

        .stat-card {
            padding: 22px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: 0.25s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-pink);
        }

        .stat-number {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card.crimson .stat-number {
            background: linear-gradient(90deg, #ff9ebb, var(--accent-crimson));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .hero-banner {
            padding: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
            position: relative;
            overflow: hidden;
        }

        .hero-text {
            max-width: 650px;
        }

        .hero-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-pink);
            margin-bottom: 10px;
        }

        .hero-text h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.25;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.65;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-crimson), #9e223b);
            color: #fff;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(214, 56, 88, 0.4);
        }

        .btn-primary:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(14, 9, 28, 0.75);
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--accent-pink);
            background: rgba(157, 101, 201, 0.25);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .section-header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .cards-slider {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .project-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            min-height: 185px;
            transition: 0.25s;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-pink);
        }

        .project-card.music-card:hover {
            border-color: var(--accent-crimson);
        }

        .card-status {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-pink);
